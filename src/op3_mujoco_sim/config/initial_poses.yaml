# Definisi Pose Preset untuk Robot Humanoid Hiro MuJoCo
# Nilai dalam radian sesuai urutan actuator Hiro

joint_order:
  - "neck_yaw"
  - "neck_pitch"
  - "left_shoulder_pitch"
  - "left_shoulder_roll"
  - "left_elbow"
  - "right_shoulder_pitch"
  - "right_shoulder_roll"
  - "right_elbow"
  - "left_hip_yaw"
  - "left_hip_roll"
  - "left_hip_pitch"
  - "left_knee"
  - "left_ankle_pitch"
  - "left_ankle_roll"
  - "right_hip_yaw"
  - "right_hip_roll"
  - "right_hip_pitch"
  - "right_knee"
  - "right_ankle_pitch"
  - "right_ankle_roll"

poses:
  zero:
    neck_yaw: 0.0
    neck_pitch: 0.0
    left_shoulder_pitch: 0.0
    left_shoulder_roll: 0.0
    left_elbow: 0.0
    right_shoulder_pitch: 0.0
    right_shoulder_roll: 0.0
    right_elbow: 0.0
    left_hip_yaw: 0.0
    left_hip_roll: 0.0
    left_hip_pitch: 0.0
    left_knee: 0.0
    left_ankle_pitch: 0.0
    left_ankle_roll: 0.0
    right_hip_yaw: 0.0
    right_hip_roll: 0.0
    right_hip_pitch: 0.0
    right_knee: 0.0
    right_ankle_pitch: 0.0
    right_ankle_roll: 0.0

  stand:
    neck_yaw: 0.0
    neck_pitch: 0.0
    left_shoulder_pitch: -0.1
    left_shoulder_roll: 0.25
    left_elbow: -0.5
    right_shoulder_pitch: 0.1
    right_shoulder_roll: -0.25
    right_elbow: 0.5
    left_hip_yaw: 0.0
    left_hip_roll: 0.0
    left_hip_pitch: 0.0
    left_knee: 0.0
    left_ankle_pitch: 0.0
    left_ankle_roll: 0.0
    right_hip_yaw: 0.0
    right_hip_roll: 0.0
    right_hip_pitch: 0.0
    right_knee: 0.0
    right_ankle_pitch: 0.0
    right_ankle_roll: 0.0

  wave_right:
    neck_yaw: -0.2
    neck_pitch: 0.1
    left_shoulder_pitch: -0.1
    left_shoulder_roll: 0.25
    left_elbow: -0.5
    right_shoulder_pitch: 1.2
    right_shoulder_roll: -0.8
    right_elbow: 1.1
    left_hip_yaw: 0.0
    left_hip_roll: 0.0
    left_hip_pitch: 0.0
    left_knee: 0.0
    left_ankle_pitch: 0.0
    left_ankle_roll: 0.0
    right_hip_yaw: 0.0
    right_hip_roll: 0.0
    right_hip_pitch: 0.0
    right_knee: 0.0
    right_ankle_pitch: 0.0
    right_ankle_roll: 0.0

  ready_squat:
    neck_yaw: 0.0
    neck_pitch: 0.1
    left_shoulder_pitch: -0.2
    left_shoulder_roll: 0.25
    left_elbow: -0.5
    right_shoulder_pitch: 0.2
    right_shoulder_roll: -0.25
    right_elbow: 0.5
    left_hip_yaw: 0.0
    left_hip_roll: 0.0
    left_hip_pitch: 0.3
    left_knee: 0.6
    left_ankle_pitch: -0.3
    left_ankle_roll: 0.0
    right_hip_yaw: 0.0
    right_hip_roll: 0.0
    right_hip_pitch: 0.3
    right_knee: 0.6
    right_ankle_pitch: -0.3
    right_ankle_roll: 0.0
